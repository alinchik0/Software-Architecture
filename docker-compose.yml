services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music}
      POSTGRES_DB: ${POSTGRES_DB:-music}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-music}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  migrate:
    build: ./user-service
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./shared:/app/shared
    command: alembic upgrade head
  user-service:
    build: ./user-service
    depends_on: [migrate, kafka]
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./proto:/app/proto
    ports: ["8001:8001", "50051:50051"]
  playlist-service:
    build: ./playlist-service
    depends_on: [migrate, kafka, redis]
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./proto:/app/proto
    ports: ["8002:8002", "50052:50052"]
  api-gateway:
    build: ./api-gateway
    depends_on: [user-service, playlist-service, redis]
    env_file: .env
    volumes:
      - ./shared:/app/shared
      - ./proto:/app/proto
    ports: ["8000:8000"]
  worker-service:
    build: ./worker-service
    depends_on: [migrate, kafka, redis]
    env_file: .env
    volumes:
      - ./shared:/app/shared
