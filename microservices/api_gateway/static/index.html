<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroMusic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран авторизации (показывается, если нет токена) -->
    <div id="auth-screen" class="screen active">
        <div class="auth-box">
            <h1>🎵 MicroMusic</h1>
            <p>Архитектурный проект: микросервисы + Deezer API</p>
            <form id="auth-form">
                <input type="email" id="email" placeholder="Email" required value="test@music.com">
                <input type="password" id="password" placeholder="Пароль" required value="test123">
                <div class="auth-buttons">
                    <button type="button" onclick="App.handleLogin()">Войти</button>
                    <button type="button" class="secondary" onclick="App.handleRegister()">Регистрация</button>
                </div>
                <p id="auth-error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- Основной экран приложения -->
    <div id="app-screen" class="screen">
        <aside class="sidebar">
            <h2>🎵 MicroMusic</h2>
            <nav>
                <button class="nav-btn active" data-view="library">📚 Моя медиатека</button>
                <button class="nav-btn" data-view="search">🔍 Поиск музыки</button>
            </nav>
            <div class="user-info">
                <p id="user-email">user@example.com</p>
                <button class="logout-btn" onclick="App.logout()">Выйти</button>
            </div>
        </aside>

        <!-- Сюда JS будет динамически подгружать разные "виды" (Views) -->
        <main id="app-content" class="main-content"></main>
    </div>

       <!-- Глобальный плеер (всегда внизу) -->
    <footer class="player-bar" id="player-bar" style="display: none;">
        <div class="player-track-info">
            <img id="player-cover" src="" alt="cover" class="player-cover-img">
            <div>
                <div id="player-title" class="player-title">Не выбрано</div>
                <div id="player-artist" class="player-artist">-</div>
            </div>
        </div>

        <div class="player-controls-wrapper">
            <div class="player-buttons">
                <button onclick="Player.toggleShuffle()" id="shuffle-btn" class="control-btn" title="Перемешать">🔀</button>
                <button onclick="Player.playPrev()" class="control-btn" title="Предыдущий">⏮</button>
                <button onclick="Player.togglePlay()" id="play-pause-btn" class="play-btn" title="Воспроизвести/Пауза">▶</button>
                <button onclick="Player.playNext()" class="control-btn" title="Следующий">⏭</button>
                <button onclick="Player.toggleRepeat()" id="repeat-btn" class="control-btn" title="Повтор">🔁</button>
            </div>
            <div class="player-progress">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-volume">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
        </div>
    </footer>

    <!-- Контейнер для Toast-уведомлений -->
    <div id="toast-container"></div>

    <!-- Подключаем модули в правильном порядке -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
