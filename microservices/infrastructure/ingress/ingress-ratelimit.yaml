---
# 1. Middleware для Rate Limiting (Task 3.3)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-middleware
  namespace: default
spec:
  rateLimit:
    average: 10      # 10 запросов в секунду
    burst: 20        # пиковый всплеск
---
# 2. Ingress без привязки к хосту (работает для localhost:8080)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micromusic-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-rate-limit-middleware@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000