apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: user-service-circuit-breaker
  namespace: default
spec:
  host: user-service  # ← ЗАЩИЩАЕМ user-service, не api-gateway!
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20  # ← УМЕНЬШИЛИ для теста
      http:
        http1MaxPendingRequests: 10  # ← УМЕНЬШИЛИ для теста
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 2       # ← СДЕЛАЛИ ЧУВСТВИТЕЛЬНЕЕ
      interval: 5s                  # ← ПРОВЕРЯЕМ ЧАЩЕ
      baseEjectionTime: 10s         # ← БЫСТРЕЕ ВОССТАНАВЛИВАЕМ
      maxEjectionPercent: 100       # ← МОЖНО ВСЕ ПОДЫ
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: catalog-service-circuit-breaker
  namespace: default
spec:
  host: catalog-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 5s
      baseEjectionTime: 10s
      maxEjectionPercent: 100