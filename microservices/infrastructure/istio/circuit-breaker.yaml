apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway-circuit-breaker
  namespace: default
spec:
  host: api-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 3       # Разомкнуть цепь после 3 ошибок 5xx подряд
      interval: 10s                 # Проверять каждые 10 секунд
      baseEjectionTime: 30s         # Держать под "в бане" 30 секунд
      maxEjectionPercent: 50        # Максимум 50% подов могут быть исключены