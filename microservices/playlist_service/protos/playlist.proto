syntax = "proto3";

package playlist;

service PlaylistService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (PlaylistResponse);
  rpc GetPlaylist(GetPlaylistRequest) returns (PlaylistResponse);
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (PlaylistResponse);
  rpc DeletePlaylist(DeletePlaylistRequest) returns (MessageResponse);
  rpc AddTrack(AddTrackRequest) returns (PlaylistResponse);
  rpc RemoveTrack(RemoveTrackRequest) returns (PlaylistResponse);
  rpc ListUserPlaylists(ListUserPlaylistsRequest) returns (ListUserPlaylistsResponse);
}

message PingRequest {}
message PingResponse { string message = 1; }

message CreatePlaylistRequest {
  int64 owner_id = 1;
  string title = 2;
  string description = 3;
  bool is_public = 4;
}

message GetPlaylistRequest {
  int64 playlist_id = 1;
  int64 user_id = 2;
}

message UpdatePlaylistRequest {
  int64 playlist_id = 1;
  int64 user_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional bool is_public = 5;
}

message DeletePlaylistRequest {
  int64 playlist_id = 1;
  int64 user_id = 2;
}

message AddTrackRequest {
  int64 playlist_id = 1;
  int64 user_id = 2;
  string spotify_track_id = 3;
  int32 position = 4;
}

message RemoveTrackRequest {
  int64 playlist_id = 1;
  int64 user_id = 2;
  string spotify_track_id = 3;
}

message ListUserPlaylistsRequest {
  int64 user_id = 1;
  int64 request_user_id = 2;
}

message TrackInfo {
  string spotify_track_id = 1;
  int32 position = 2;
  optional string title = 3;
  optional string artist = 4;
}

message PlaylistResponse {
  bool success = 1;
  string message = 2;
  int64 playlist_id = 3;
  int64 owner_id = 4;
  string title = 5;
  string description = 6;
  bool is_public = 7;
  repeated TrackInfo tracks = 8;
}

message MessageResponse {
  bool success = 1;
  string message = 2;
}

message ListUserPlaylistsResponse {
  bool success = 1;
  string message = 2;
  repeated PlaylistResponse playlists = 3;
}