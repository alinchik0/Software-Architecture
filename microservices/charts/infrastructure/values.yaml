postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: music_db
  primary:
    persistence:
      size: 1Gi

redis:
  enabled: true
  auth:
    enabled: false

kafka:
  enabled: true
  zookeeper:
    enabled: true
  listeners:
    client:
      protocol: PLAINTEXT
  # Полная конфигурация окружения для Confluent Kafka в Kubernetes
  env:
    - name: KAFKA_BROKER_ID
      value: "1"
    - name: KAFKA_ZOOKEEPER_CONNECT
      value: "zookeeper:2181"
    - name: KAFKA_LISTENERS
      value: "PLAINTEXT://0.0.0.0:9092"
    - name: KAFKA_ADVERTISED_LISTENERS
      value: "PLAINTEXT://kafka:9092"
    - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
      value: "1"
    - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
      value: "1"

mongodb:
  enabled: true
  auth:
    enabled: false
  persistence:
    size: 1Gi