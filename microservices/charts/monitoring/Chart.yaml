apiVersion: v2
name: monitoring
description: Observability stack for MicroMusic (Prometheus, Grafana, Loki, Jaeger, OpenTelemetry Collector)
type: application
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  # 1. Prometheus + Grafana (уже было)
  - name: kube-prometheus-stack
    version: "58.3.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    alias: prometheus

  # 2. Loki + Promtail для логов (уже было, даёт +5 баллов)
  - name: loki-stack
    version: "2.10.2"
    repository: "https://grafana.github.io/helm-charts"
    alias: loki

  # 3. OpenTelemetry Collector (НОВОЕ: принимает метрики и трейсы от приложений)
  - name: opentelemetry-collector
    version: "0.94.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    alias: otel-collector

  # 4. Jaeger (НОВОЕ: хранит и показывает распределённые трейсы)
  - name: jaeger
    version: "3.1.0"
    repository: "https://jaegertracing.github.io/helm-charts"
    alias: jaeger