apiVersion: v2
name: monitoring
description: Observability stack for MicroMusic (Prometheus, Grafana, Loki)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "58.3.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    alias: prometheus
  - name: loki-stack
    version: "2.10.2"
    repository: "https://grafana.github.io/helm-charts"
    alias: loki