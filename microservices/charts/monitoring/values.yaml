# --- Настройки для Prometheus Stack (включает Grafana) ---
prometheus:
  grafana:
    adminPassword: "admin"
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://microservices-monitoring-loki:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000


loki:
  loki:
    enabled: true
    config:
      auth_enabled: false
      ingester:
        chunk_idle_period: 3m
        chunk_block_size: 262144
        chunk_retain_period: 1m
  promtail:
    enabled: true
    config:
      clients:
        - url: http://microservices-monitoring-loki:3100/loki/api/v1/push


  grafana:
    sidecar:
      datasources:
        enabled: false