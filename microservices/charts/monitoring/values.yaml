# --- Настройки для Prometheus Stack (включает Grafana) ---
prometheus: # <-- это alias для kube-prometheus-stack, указанный в вашем Chart.yaml
  prometheusOperator:
    admissionWebhooks:
      enabled: false          # Отключаем вебхуки оператора
      patch:
        enabled: false        # Отключаем job "admission-create" (именно он вызывает ошибку)
  prometheus:
    prometheusSpec:
      admissionWebhooks:
        enabled: false        # Отключаем вебхуки для самого Prometheus

  grafana:
    adminPassword: "admin"
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://microservices-monitoring-loki:3100
        access: proxy
        isDefault: false
        editable: false

loki:
  promtail:
    enabled: true
    config:
      clients:
        - url: http://microservices-monitoring-loki:3100/loki/api/v1/push
      scrape_configs:
        - job_name: kubernetes-pods
          pipeline_stages:
            - cri: {}
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels:
                - __meta_kubernetes_pod_label_app
              target_label: app
            - source_labels:
                - __meta_kubernetes_pod_container_name
              target_label: container
            - source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
  grafana:
    sidecar:
      datasources:
        enabled: false