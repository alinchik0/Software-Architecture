# ==========================================
# 1. PROMETHEUS & GRAFANA (Существующее)
# ==========================================
prometheus:
  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
  prometheus:
    prometheusSpec:
      admissionWebhooks:
        enabled: false
  grafana:
    adminPassword: "admin"
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://microservices-monitoring-loki:3100
        access: proxy
        isDefault: false
        editable: false
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://microservices-monitoring-jaeger:16686
        access: proxy
        isDefault: false
        editable: false
    sidecar:
      datasources:
        enabled: false

# ==========================================
# 2. LOKI & PROMTAIL (Существующее, для +5 баллов)
# ==========================================
loki:
  promtail:
    enabled: true
    config:
      clients:
        - url: http://microservices-monitoring-loki:3100/loki/api/v1/push
      scrape_configs:
        - job_name: kubernetes-pods
          pipeline_stages:
            - cri: {}
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app
            - source_labels: [__meta_kubernetes_pod_container_name]
              target_label: container
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace

# ==========================================
# 3. JAEGER (НОВОЕ: для трассировки)
# ==========================================
jaeger:
  allInOne:
    enabled: true
    image:
      tag: "1.53" # Стабильная версия
    extraEnv:
      - name: COLLECTOR_OTLP_ENABLED
        value: "true" # Включаем приём OTLP напрямую (на случай, если захотим слать мимо коллектора)
  storage:
    type: memory # Для демо/учебы достаточно памяти, не требует Persistent Volume

# ==========================================
# 4. OPENTELEMETRY COLLECTOR (НОВОЕ: центральный хаб)
# ==========================================
otel-collector:
  mode: "deployment"

  # Конфигурация пайплайнов обработки данных
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {} # Группирует данные для эффективной отправки
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

    exporters:
      debug:
        verbosity: detailed # Полезно для отладки, видно в подах коллектора
      otlp/jaeger:
        endpoint: "microservices-monitoring-jaeger:4317" # Имя сервиса Jaeger в K8s
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: "microservices"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug] # Логи уже собираются Promtail, но это для полноты картины

  # Открываем порты для приёма данных от микросервисов
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  # Автоматически создаём ServiceMonitor, чтобы Prometheus знал, что нужно скрейпить метрики с коллектора
  serviceMonitor:
    enabled: true
    metricsEndpoints:
      - port: metrics
        interval: 15s