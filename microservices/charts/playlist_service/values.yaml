replicaCount: 2

image:
  repository: sigmawoman/playlist_service
  pullPolicy: IfNotPresent
  tag: "b7f9c0ac2a3da985bb1470b4b81cc2c22c5c02ff"

service:
  type: ClusterIP
  port: 50052

env:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/music_db"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "playlist_events"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"