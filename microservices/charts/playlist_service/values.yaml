replicaCount: 2

image:
  repository: sigmawoman/playlist_service
  pullPolicy: IfNotPresent
  tag: "1669558d4285f0f3d1fd6fd9c76228d5a3dcf653"

service:
  type: ClusterIP
  port: 50052

env:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/music_db"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "playlist_events"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"