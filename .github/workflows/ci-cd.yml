name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'microservices/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Имена точно совпадают с вашим выводом ls (с подчёркиванием)
        service: [api_gateway, user_service, playlist_service, catalog_service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Kaniko Build and Push
        run: |
          # Прямой вызов Kaniko с абсолютными путями. Это исключает любые ошибки с "../"
          docker run --rm \
            -v ${{ github.workspace }}/microservices:/workspace \
            -v $HOME/.docker/config.json:/kaniko/.docker/config.json:ro \
            gcr.io/kaniko-project/executor:v1.23.2 \
            --dockerfile /workspace/${{ matrix.service }}/Dockerfile \
            --context dir:///workspace/ \
            --destination ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  update-helm-charts:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Helm charts
        run: |
          NEW_TAG="${{ github.sha }}"
          CHART_DIR="microservices/charts"
          
          # ВАЖНО: Если вы создали папки чартов с подчёркиванием (api_gateway), 
          # замените "api-gateway" на "api_gateway" в путях ниже.
          
          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/api_gateway|g" $CHART_DIR/api_gateway/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" $CHART_DIR/api-gateway/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/user_service|g" $CHART_DIR/user_service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" $CHART_DIR/user_service/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/playlist_service|g" $CHART_DIR/playlist_service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" $CHART_DIR/playlist-service/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/catalog_service|g" $CHART_DIR/catalog_service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" $CHART_DIR/catalog_service/values.yaml

      - name: Commit and push updated charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add microservices/charts/*/values.yaml
            git commit -m "chore: update helm chart image tags to $NEW_TAG"
            git push
          fi