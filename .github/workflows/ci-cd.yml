name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'microservices/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api_gateway, user_service, playlist_service, catalog_service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Kaniko Build and Push
        uses: int128/kaniko-action@v1
        with:
          push: true
          cache: false
          file: ${{ matrix.service }}/Dockerfile
          context: microservices/
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  update-helm-charts:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Helm charts
        run: |
          NEW_TAG="${{ github.sha }}"
          
          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/api_gateway|g" microservices/charts/api-gateway/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" microservices/charts/api-gateway/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/user_service|g" microservices/charts/user-service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" microservices/charts/user-service/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/playlist_service|g" microservices/charts/playlist-service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" microservices/charts/playlist-service/values.yaml

          sed -i "s|repository: .*|repository: ${{ secrets.DOCKER_USERNAME }}/catalog_service|g" microservices/charts/catalog-service/values.yaml
          sed -i "s|tag: \".*\"|tag: \"$NEW_TAG\"|g" microservices/charts/catalog-service/values.yaml

      - name: Commit and push updated charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add microservices/charts/*/values.yaml
            git commit -m "chore: update helm chart image tags to $NEW_TAG"
            git push
          fi